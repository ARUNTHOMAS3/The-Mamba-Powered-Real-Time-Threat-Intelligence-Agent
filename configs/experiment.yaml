# =============================================================
# Unified Experiment Configuration
# Single source of truth for all hyperparameters
# All models and datasets are controlled from this file
# =============================================================

# Datasets to benchmark
datasets:
  - CICIDS2017
  - UNSW-NB15

# Models to compare (4 core models — sufficient for publication)
models:
  - Mamba
  - LSTM
  - GRU
  - CNN-LSTM

# Random seeds for statistical significance (10 runs — enables Wilcoxon p<0.05)
seeds: [42, 123, 456, 789, 2024, 7, 314, 999, 1337, 8888]

# Dataset Configuration
dataset:
  seq_len: 50
  binary_classification: true
  temporal_split:
    train: 0.7
    val: 0.1
    test: 0.2
  shuffle: false  # Strict temporal order

# Model Architecture (shared across all models)
model:
  d_model: 128
  n_layers: 2

# Training Hyperparameters (identical for all models)
training:
  batch_size: 128
  epochs: 30
  learning_rate: 0.001
  optimizer: Adam
  loss: BCEWithLogitsLoss
  early_stopping:
    patience: 5
    metric: val_f1
    mode: max

# Fair Comparison
fair_comparison:
  enforce_capacity_parity: true
  max_param_diff_percent: 15.0  # Maximum ±15% difference allowed

# Device
device: auto  # cuda if available, else cpu

# Paths
paths:
  data_dir: data/raw
  output_dir: outputs/benchmark_results
  model_dir: outputs/checkpoints
